esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    # The AXP2101 power chip feeds the audio codec, camera and touch rails.
    # It normally comes up configured, but after the battery has been flat
    # it can boot with some rails off. This puts them back the way
    # Waveshare's own firmware sets them (3.3 V on ALDO1-4, 1.5/2.8 V BLDOs).
    - priority: 850
      then:
        - lambda: |-
            const uint8_t vregs[6] = {0x92, 0x93, 0x94, 0x95, 0x96, 0x97};
            const uint8_t vvals[6] = {28, 28, 28, 28, 10, 23};  // (mV - 500) / 100
            for (int i = 0; i < 6; i++) {
              auto cur = id(pmu).read_byte(vregs[i]);
              if (cur.has_value())
                id(pmu).write_byte(vregs[i], (*cur & 0xE0) | vvals[i]);
            }
            auto en = id(pmu).read_byte(0x90);
            if (en.has_value())
              id(pmu).write_byte(0x90, *en | 0x3F);  // ALDO1-4, BLDO1-2 on
    - priority: -100
      then:
        - light.turn_on:
            id: backlight
            brightness: ${bright_active}

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
  on_connect:
    - lvgl.label.update:
        id: wifi_icon
        text: "\U000F05A9"
  on_disconnect:
    - lvgl.label.update:
        id: wifi_icon
        text: "\U000F05AA"

captive_portal:

logger:
  level: INFO

api:
  on_client_connected:
    - lvgl.label.update:
        id: wifi_icon
        text_color: ${col_text}
    - delay: 2s
    - if:
        condition:
          - switch.is_on: wake_word_enabled
          - not: voice_assistant.is_running
        then:
          - micro_wake_word.start:
  on_client_disconnected:
    - lvgl.label.update:
        id: wifi_icon
        text_color: ${col_dim}
    - voice_assistant.stop:
    - micro_wake_word.stop:

ota:
  - platform: esphome

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/London
    on_time_sync:
      - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock

# =============================================================================
# Hardware - you should not need to change anything below this line
# =============================================================================
# Pins from Waveshare's board support package and the V1/V2 schematics.
i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO7
    frequency: 400kHz

# TCA9554 IO expander
#   EXIO0 camera power-down   EXIO1 LCD + touch reset   EXIO2 touch interrupt
#   EXIO6 PWR button           EXIO7 speaker amplifier (NS4150B) enable
pca9554:
  - id: exio
    address: 0x20

# AXP2101 power management chip, used by the on_boot lambda above
i2c_device:
  - id: pmu
    address: 0x34

switch:
  - platform: gpio
    id: speaker_amp
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      pca9554: exio
      number: 7

  - platform: template
    id: wake_word_enabled
    name: "Wake word"
    icon: mdi:account-voice
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - if:
          condition:
            not: voice_assistant.is_running
          then:
            - micro_wake_word.start:
    on_turn_off:
      - micro_wake_word.stop:

binary_sensor:
  # PWR button on the side: press to wake the screen
  - platform: gpio
    id: pwr_button
    name: "Power button"
    pin:
      pca9554: exio
      number: 6
    on_press:
      - script.execute: wake_screen

  - platform: homeassistant
    id: leak_state
    entity_id: ${leak_entity}
    trigger_on_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: leak_tile
          bg_color: !lambda 'return x ? lv_color_hex(${col_alert}) : lv_color_hex(${col_ok});'
      - lvgl.label.update:
          id: leak_ic
          text: !lambda 'return x ? "\U000F1502" : "\U000F1504";'
      - lvgl.label.update:
          id: leak_val
          text: !lambda 'return x ? "LEAK!" : "Dry";'
      - if:
          condition:
            lambda: 'return x;'
          then:
            - script.execute: wake_screen
            - lvgl.page.show: climate_page

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO6
    frequency: 5000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Screen"
    icon: mdi:tablet
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms
    entity_category: config

spi:
  - id: lcd_spi
    clk_pin: GPIO5
    mosi_pin: GPIO1

display:
  - platform: mipi_spi
    id: lcd
    model: ST7796
    spi_id: lcd_spi
    dc_pin:
      number: GPIO3
      ignore_strapping_warning: true
    # No CS line on this board; reset comes from the IO expander.
    reset_pin:
      pca9554: exio
      number: 1
    # Same mode and colour order as your existing DisplayIQ config, which
    # is known to work on this panel.
    spi_mode: MODE1
    data_rate: 40MHz        # drop to 20MHz if you see noise or stripes
    color_order: rgb
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: ft63x6
    id: touch
    display: lcd
    # Touch follows the display rotation automatically. If taps land in the
    # wrong place, uncomment this - it is what your old DisplayIQ config
    # used - or flip the values until they line up.
    # transform:
    #   swap_xy: true
    #   mirror_x: false
    #   mirror_y: true
    on_release:
      - if:
          condition:
            lambda: 'return id(dimmed);'
          then:
            - script.execute: wake_screen

# =============================================================================
# Audio - ES8311 codec, speaker amp on EXIO7, analog mic into the codec
# =============================================================================
i2s_audio:
  - id: i2s_bus
    i2s_mclk_pin: GPIO12
    i2s_bclk_pin: GPIO13
    i2s_lrclk_pin: GPIO15

audio_dac:
  - platform: es8311
    id: codec
    address: 0x18
    sample_rate: 16000
    bits_per_sample: 16bit
    use_mclk: true
    use_microphone: false   # false = analog mic (this board)
    mic_gain: 42DB          # drop to 30DB if Assist mishears you from close up

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO14
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left           # try "right" if Assist hears nothing

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO16
    dac_type: external
    audio_dac: codec
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono

micro_wake_word:
  id: mww
  microphone: mic
  models:
    - model: okay_nabu
  on_wake_word_detected:
    - script.execute: wake_screen
    - lvgl.page.show: voice_page
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: mic
  speaker: spk
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - lvgl.label.update: {id: voice_state, text: "Listening..."}
    - lvgl.label.update: {id: voice_stt, text: ""}
    - lvgl.label.update: {id: voice_reply, text: ""}
    - lvgl.widget.update: {id: mic_btn, state: {checked: true}}
  on_stt_end:
    - lvgl.label.update: {id: voice_state, text: "Thinking..."}
    - lvgl.label.update:
        id: voice_stt
        text: !lambda 'return "\"" + x + "\"";'
  on_tts_start:
    - lvgl.label.update: {id: voice_state, text: "Answering..."}
    - lvgl.label.update:
        id: voice_reply
        text: !lambda 'return x;'
  on_error:
    - lvgl.label.update:
        id: voice_state
        text: !lambda 'return message;'
  on_end:
    - lvgl.widget.update: {id: mic_btn, state: {checked: false}}
    - lvgl.label.update: {id: voice_state, text: "Tap the mic or say \"Okay Nabu\""}
    - wait_until:
        not: voice_assistant.is_running
    - if:
        condition:
          switch.is_on: wake_word_enabled
        then:
          - micro_wake_word.start:

