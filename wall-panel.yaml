globals:
  - id: dimmed
    type: bool
    initial_value: 'false'

script:
  - id: update_clock
    then:
      - lvgl.label.update:
          id: status_clock
          text: !lambda 'return id(ha_time).now().strftime("%H:%M");'

  - id: wake_screen
    then:
      - lvgl.widget.update:
          id: wake_shield
          hidden: true
      - globals.set: {id: dimmed, value: 'false'}
      - light.turn_on:
          id: backlight
          brightness: ${bright_active}

  # Taps, cold tap and shower need a long press; a short tap shows this hint.
  - id: hold_hint
    mode: restart
    then:
      - lvgl.label.update: {id: status_clock, text: "Hold to use"}
      - delay: 2s
      - script.execute: update_clock

  - id: nav_select
    parameters:
      p: int
    then:
      - lvgl.widget.update: {id: nav_0, state: {checked: !lambda 'return p == 0;'}}
      - lvgl.widget.update: {id: nav_1, state: {checked: !lambda 'return p == 1;'}}
      - lvgl.widget.update: {id: nav_2, state: {checked: !lambda 'return p == 2;'}}
      - lvgl.widget.update: {id: nav_3, state: {checked: !lambda 'return p == 3;'}}
      - lvgl.widget.update: {id: nav_4, state: {checked: !lambda 'return p == 4;'}}
      - lvgl.widget.update: {id: nav_5, state: {checked: !lambda 'return p == 5;'}}

