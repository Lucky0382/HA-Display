# =============================================================================
# Screen
# =============================================================================
lvgl:
  displays: lcd
  # 90 = landscape one way up, 270 = the other way up.
  rotation: 90
  touchscreens:
    - touchscreen_id: touch
      long_press_time: 700ms   # how long to hold the tap / shower tiles
  buffer_size: 25%
  bg_color: ${col_bg}
  page_wrap: true

  # Dim after a while; the first touch on a dim screen only wakes it.
  on_idle:
    timeout: ${dim_after}
    then:
      - if:
          condition:
            lambda: 'return !id(dimmed);'
          then:
            - globals.set: {id: dimmed, value: 'true'}
            - lvgl.widget.update:
                id: wake_shield
                hidden: false
            - light.turn_on:
                id: backlight
                brightness: ${bright_idle}

  theme:
    button:
      bg_color: ${col_tile}
      bg_opa: cover
      border_width: 0
      shadow_width: 0
      radius: 14
      text_color: ${col_text}
      text_font: montserrat_16
      pressed:
        bg_color: 0x41474E
      checked:
        bg_color: ${col_tile_on}
        text_color: ${col_text_on}
    label:
      text_color: ${col_text}

  style_definitions:
    - id: page_style
      bg_color: ${col_bg}
      bg_opa: cover
      text_color: ${col_text}
      pad_top: 40
      pad_bottom: 54
      pad_left: 8
      pad_right: 8
      pad_row: 8
      pad_column: 8
    - id: info_style
      bg_color: ${col_tile}
      bg_opa: cover
      border_width: 0
      radius: 14
      pad_all: 8
      text_color: ${col_text}

  # ------------------------------------------------- always on top of pages --
  top_layer:
    widgets:
      # Status bar
      - obj:
          align: top_mid
          width: 100%
          height: 36
          bg_opa: transp
          border_width: 0
          pad_left: 12
          pad_right: 12
          text_color: ${col_text}
          clickable: false
          scrollable: false
          widgets:
            - label:
                id: status_temp
                align: left_mid
                text_font: montserrat_20
                text: "--°"
            - label:
                id: status_clock
                align: center
                text_font: montserrat_20
                text: "--:--"
            - label:
                id: wifi_icon
                align: right_mid
                text_font: status_font
                text_color: ${col_dim}
                text: "\U000F05AA"
      # Page switcher
      - obj:
          align: bottom_mid
          width: 100%
          height: 50
          bg_color: ${col_bg}
          bg_opa: cover
          border_width: 0
          radius: 0
          pad_all: 4
          scrollable: false
          layout:
            type: flex
            flex_flow: row
            flex_align_main: space_evenly
            flex_align_cross: center
          widgets:
            - button:
                id: nav_0
                width: 68
                height: 42
                bg_opa: transp
                text_color: ${col_dim}
                checked:
                  bg_opa: cover
                  bg_color: ${col_tile}
                  text_color: ${col_tile_on}
                widgets:
                  - label:
                      align: center
                      text_font: nav_font
                      text: "\U000F0335"
                on_click:
                  - lvgl.page.show: lights_page
            - button:
                id: nav_1
                width: 68
                height: 42
                bg_opa: transp
                text_color: ${col_dim}
                checked:
                  bg_opa: cover
                  bg_color: ${col_tile}
                  text_color: ${col_tile_on}
                widgets:
                  - label:
                      align: center
                      text_font: nav_font
                      text: "\U000F1254"
                on_click:
                  - lvgl.page.show: hallbath_page
            - button:
                id: nav_2
                width: 68
                height: 42
                bg_opa: transp
                text_color: ${col_dim}
                checked:
                  bg_opa: cover
                  bg_color: ${col_tile}
                  text_color: ${col_tile_on}
                widgets:
                  - label:
                      align: center
                      text_font: nav_font
                      text: "\U000F0F92"
                on_click:
                  - lvgl.page.show: water_page
            - button:
                id: nav_3
                width: 68
                height: 42
                bg_opa: transp
                text_color: ${col_dim}
                checked:
                  bg_opa: cover
                  bg_color: ${col_tile}
                  text_color: ${col_tile_on}
                widgets:
                  - label:
                      align: center
                      text_font: nav_font
                      text: "\U000F02DC"
                on_click:
                  - lvgl.page.show: modes_page
            - button:
                id: nav_4
                width: 68
                height: 42
                bg_opa: transp
                text_color: ${col_dim}
                checked:
                  bg_opa: cover
                  bg_color: ${col_tile}
                  text_color: ${col_tile_on}
                widgets:
                  - label:
                      align: center
                      text_font: nav_font
                      text: "\U000F050F"
                on_click:
                  - lvgl.page.show: climate_page
            - button:
                id: nav_5
                width: 68
                height: 42
                bg_opa: transp
                text_color: ${col_dim}
                checked:
                  bg_opa: cover
                  bg_color: ${col_tile}
                  text_color: ${col_tile_on}
                widgets:
                  - label:
                      align: center
                      text_font: nav_font
                      text: "\U000F036C"
                on_click:
                  - lvgl.page.show: voice_page
      # Full-screen catcher, shown only while the screen is dimmed, so the
      # touch that wakes the panel can't also toggle a light.
      - obj:
          id: wake_shield
          hidden: true
          align: center
          width: 100%
          height: 100%
          bg_opa: transp
          border_width: 0
          radius: 0
          on_press:
            - script.execute: wake_screen

  pages:
    - id: lights_page
      styles: page_style
      scrollbar_mode: "off"
      on_load:
        - script.execute: {id: nav_select, p: 0}
      on_swipe_left:
        - lambda: 'lv_indev_wait_release(lv_indev_active());'
        - lvgl.page.next:
            animation: move_left
            time: 200ms
      on_swipe_right:
        - lambda: 'lv_indev_wait_release(lv_indev_active());'
        - lvgl.page.previous:
            animation: move_right
            time: 200ms
      layout:
        type: grid
        grid_columns: [FR(1), FR(1), FR(1), FR(1)]
        grid_rows: [FR(1), FR(1)]
      widgets:
        - button:
            id: l1_tile
            grid_cell_column_pos: 0
            grid_cell_row_pos: 0
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            gesture_bubble: true
            pad_all: 8
            widgets:
              - label:
                  align: top_left
                  text_font: icon_font
                  text: ${l1_icon}
              - label:
                  align: bottom_left
                  width: 100%
                  long_mode: wrap
                  text: ${l1_name}
            on_click:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: ${l1_entity}
