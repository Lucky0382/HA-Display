# =============================================================================
# Wall panel - Waveshare ESP32-S3-Touch-LCD-3.5-C  (320x480 ST7796, run landscape)
# =============================================================================
# Layout
#   Status bar   outside temp | clock | Wi-Fi / Home Assistant link
#   Page 1       Lights            8 tiles
#   Page 2       Hall & bath       8 tiles
#   Page 3       Water & heat      8 tiles  (taps + shower need a LONG PRESS)
#   Page 4       Modes & blinds    8 tiles
#   Page 5       Climate           temperatures, hot water, solar, leak sensor
#   Page 6       Voice assistant   tap the mic, or say "Okay Nabu"
#   Swipe left/right or use the bar at the bottom to change page.
#   Tiles turn amber when the entity is on / open.
#
# Everything you would normally change is in the substitutions block.
#
# Changing an icon: find it at https://pictogrammers.com/library/mdi/, take its
# F0xxx code and write it as "\U000F0xxx". Then make sure that same code is
# in the glyphs: list of icon_font further down (each code only once).
#
# Before the first flash:
#   * Home Assistant > Settings > Devices > ESPHome > this device > CONFIGURE
#     and turn on "Allow the device to perform Home Assistant actions",
#     otherwise tapping a tile does nothing.
#   * Written for the current ESPHome release - update the ESPHome add-on first.
# =============================================================================

substitutions:
  name: "displayiq"       # must match the device already in ESPHome
  friendly_name: "DisplayIQ"

  # ------------------------------------------------------------ backlight --
  bright_active: "90%"
  bright_idle: "8%"        # "0%" turns the screen off when idle
  dim_after: 60s

  # ----------------------------------------------------------------- look --
  col_bg: "0x0A0D11"       # page background
  col_tile: "0x2B3036"     # tile, off
  col_tile_on: "0xF07A14"  # tile, on (amber)
  col_text: "0xFFFFFF"
  col_text_on: "0x14100A"  # text on an amber tile
  col_dim: "0x8A9399"      # secondary text, inactive nav
  col_ok: "0x2E7D32"       # leak tile, dry
  col_alert: "0xC62828"    # leak tile, wet

  # Outside temperature for the status bar
  outside_temp: "sensor.met_office_eastville_temperature"

  # ------------------------------------------------- lights page --
  l1_entity: "light.bedroom"
  l1_name: "Bedroom"
  l1_icon: "\U000F02E3"
